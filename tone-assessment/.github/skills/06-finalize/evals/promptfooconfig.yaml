# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 06-finalize — validate G5 enforcement (tone, fact diff, change accountability), punch-out closure, audit report, and success logging.

prompts:
  - file://../SKILL.md

providers:
  - id: openai:chat:gpt-4
  - id: anthropic:claude-3-5-sonnet-20241022

defaultTest:
  options:
    provider: anthropic:claude-3-5-sonnet-20241022

tests:
  - description: E1 — G5 fails when tone violates template/prior-report conventions
    vars:
      toned: '## Identities\nWe enforced MFA.'
      draft: '## Identities\nMFA was enforced.'
      template: '## Identities\n(third-person past tense required)'
      report_prev_quarter: '## Identities\nMFA was enforced for all users.'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: G5 failure
      - type: llm-rubric
        value: The agent detects the banned first-person pattern and records a G5 tone failure.

  - description: E2 — G5 fails when a factual token is altered
    vars:
      toned: '## Devices\nThe device compliance rate was 99%.'
      draft: '## Devices\nThe device compliance rate was 97%.'
      template: '## Devices'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: G5 failure
      - type: llm-rubric
        value: The agent detects the altered percentage and records a G5 fact-preservation failure.

  - description: E3 — G5 fails when an edit is not recorded in tone-changes.json
    vars:
      toned: '## Identities\nMulti-factor authentication was enforced.'
      draft: '## Identities\nWe enforced MFA.'
      tone_changes: '{"changes":[]}'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: G5 failure
      - type: llm-rubric
        value: The agent detects that edits between draft.md and toned.md are missing from tone-changes.json and records a G5 change-accountability failure.

  - description: E4 — Final assembly blocked until all triggered punch-outs are approved
    vars:
      toned: '## Identities\nMFA was enforced.'
      draft: '## Identities\nMFA was enforced.'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":true,"approved":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: STOP
      - type: llm-rubric
        value: The agent stops and does not assemble the final deliverable while an unapproved triggered punch-out exists.

  - description: E5 — audit-report.md, success-log.md, and deliverable emitted on success
    vars:
      toned: '## Identities\nMFA was enforced.'
      draft: '## Identities\nMFA was enforced.'
      tone_changes: '{"changes":[{"location":"Identities","before":"We enforced MFA.","after":"MFA was enforced.","style_marker":"voice"}]}'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: audit-report.md
      - type: contains
        value: success-log.md
      - type: llm-rubric
        value: On a successful G5 pass with no unapproved punch-outs, the agent emits the final deliverable, writes audit-report.md, and appends to success-log.md.
