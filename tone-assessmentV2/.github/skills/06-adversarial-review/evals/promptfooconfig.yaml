# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 06-finalize (V2) — validate G5 enforcement (assessment quality, substance freeze, change accountability), punch-out closure, audit report, and success logging.

prompts:
  - file://../SKILL.md

providers:
  - id: openai:chat:gpt-4
  - id: anthropic:claude-3-5-sonnet-20241022

defaultTest:
  options:
    provider: anthropic:claude-3-5-sonnet-20241022

tests:
  - description: E1 — G5 fails when tone violates professional assessment standards
    vars:
      toned: '## Identities\nWe turned on MFA. It is good.'
      draft: '## Identities\nMFA was enabled for all users.'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: G5 failure
      - type: llm-rubric
        value: The agent detects the first-person voice and colloquial filler, and records a G5 assessment-quality failure.

  - description: E2 — G5 fails when a factual token is altered
    vars:
      toned: '## Devices\nThe device compliance rate was 99%.'
      draft: '## Devices\nThe device compliance rate was 97%.'
      template: '## Devices'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: G5 failure
      - type: llm-rubric
        value: The agent detects the altered percentage and records a G5 substance freeze failure.

  - description: E3 — G5 fails when an edit is not recorded in tone-changes.json
    vars:
      toned: '## Identities\nMulti-factor authentication was enforced.'
      draft: '## Identities\nWe enforced MFA.'
      tone_changes: '{"changes":[]}'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: G5 failure
      - type: llm-rubric
        value: The agent detects that edits between draft.md and toned.md are missing from tone-changes.json and records a G5 change-accountability failure.

  - description: E4 — Final assembly blocked until all triggered punch-outs are approved
    vars:
      toned: '## Identities\nMulti-factor authentication was enforced for all licensed users.'
      draft: '## Identities\nWe enforced MFA for all licensed users.'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":true,"approved":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: STOP
      - type: llm-rubric
        value: The agent stops and does not assemble the final deliverable while an unapproved triggered punch-out exists.

  - description: E5 — G5 fails when toned.md shows no assessment depth (unchanged draft)
    vars:
      toned: '## Identities\nMFA was turned on for users. It is good.'
      draft: '## Identities\nMFA was turned on for users. It is good.'
      tone_changes: '{"changes":[]}'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: G5 failure
      - type: llm-rubric
        value: The agent fails G5 because toned.md was not substantively edited to professional standards — colloquial phrasing and filler remain — even though no first-person pattern is present.

  - description: E6 — audit-report.md, success-log.md, and deliverable emitted on success
    vars:
      toned: '## Identities\nMulti-factor authentication was enforced for all licensed users.'
      draft: '## Identities\nWe enforced MFA for all licensed users.'
      tone_changes: '{"changes":[{"location":"Identities","before":"We enforced MFA for all licensed users.","after":"Multi-factor authentication was enforced for all licensed users.","style_marker":"voice","reason":"Converted first-person statement into formal third-person assessment prose.","assessment_function":"professional_tone","facts_changed":false},{"location":"Identities","before":"MFA was enabled for all users.","after":"Building on the identity controls enforced earlier in the quarter, multi-factor authentication coverage was extended to all licensed users — a verified improvement in authentication posture.","style_marker":"narrative","reason":"Converted point-in-time control status into quarter-over-quarter movement analysis.","assessment_function":"quarter_movement","facts_changed":false}]}'
      template: '## Identities'
      run_state: '{"punchouts":{"A_missing_content":{"triggered":false},"E_loop_exhaustion":{"triggered":false}},"loop_counters":{"G5":0}}'
    assert:
      - type: contains
        value: audit-report.md
      - type: contains
        value: success-log.md
      - type: llm-rubric
        value: On a successful G5 pass with no unapproved punch-outs, the agent emits the final deliverable, writes audit-report.md, and appends to success-log.md.
