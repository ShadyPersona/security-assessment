# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 05-tone-consistency — validate G4 enforcement, style conformance, and fact preservation.

prompts:
  - file://../SKILL.md

providers:
  - id: openai:chat:gpt-4
  - id: anthropic:claude-3-sonnet-20240229

defaultTest:
  options:
    provider: anthropic:claude-3-sonnet-20240229

tests:
  - description: E1 — Drafting blocked when G4 fails (unresolved claims)
    vars:
      review: '{"claims":[{"claim_id":"C-001","matrix_id":"F-001","verdict":"unresolved"}]}'
      draft_map: '{"sections":[{"heading":"Identities","matrix_ids":["F-001"]}]}'
      run_state: '{"loop_counters":{"G4":0}}'
    assert:
      - type: contains
        value: G4 failure
      - type: llm-rubric
        value: The agent does not produce toned.md when review.json contains unresolved claims.

  - description: E2 — Tone deviations are corrected to match style-profile.json
    vars:
      review: '## Identities\nWe enforced MFA for all users.'
      style_profile: '{"voice":"third-person formal","tense":"past","phrasing_conventions":["was enforced"],"formatting_conventions":["## section headings"],"banned_patterns":["we","I","our"]}'
      review_state: '{"claims":[{"claim_id":"C-001","matrix_id":"F-001","verdict":"confirmed"}]}'
      draft_map: '{"sections":[{"heading":"Identities","matrix_ids":["F-001"]}]}'
    assert:
      - type: not-contains
        value: 'We '
      - type: contains
        value: was enforced
      - type: llm-rubric
        value: The toned output removes first-person voice and adopts the third-person past-tense phrasing convention.

  - description: E3 — Internal classification labels are removed from report text
    vars:
      review: '## Identities\nThis finding has Regressed.'
      style_profile: '{"voice":"third-person formal","tense":"past","phrasing_conventions":[],"formatting_conventions":[],"banned_patterns":["Regressed","Improved","Unable to validate"]}'
      review_state: '{"claims":[{"claim_id":"C-001","matrix_id":"F-001","verdict":"confirmed"}]}'
      draft_map: '{"sections":[{"heading":"Identities","matrix_ids":["F-001"]}]}'
    assert:
      - type: not-contains
        value: Regressed
      - type: llm-rubric
        value: The toned output removes the internal classification label while preserving the underlying factual content.

  - description: E4 — Facts are preserved exactly (numbers, dates, CIS/NIST refs)
    vars:
      reviewed: '## Devices\nAs of 2026-09-30, the device compliance rate was 97% (CIS M365 2.1.1, NIST PR.DS-01).'
      style_profile: '{"voice":"third-person formal","tense":"past","phrasing_conventions":[],"formatting_conventions":[],"banned_patterns":[]}'
      review_state: '{"claims":[{"claim_id":"C-001","matrix_id":"F-001","verdict":"confirmed"}]}'
      draft_map: '{"sections":[{"heading":"Devices","matrix_ids":["F-001"]}]}'
    assert:
      - type: contains
        value: '2026-09-30'
      - type: contains
        value: '97%'
      - type: contains
        value: 'CIS M365 2.1.1'
      - type: llm-rubric
        value: Every number, date, percentage, and framework reference from reviewed.md appears unchanged in toned.md.

  - description: E5 — Every edit recorded in tone-changes.json with a style_marker
    vars:
      reviewed: '## Identities\nWe enforced MFA.'
      style_profile: '{"voice":"third-person formal","tense":"past","phrasing_conventions":["was enforced"],"formatting_conventions":[],"banned_patterns":["we","I"]}'
      review_state: '{"claims":[{"claim_id":"C-001","matrix_id":"F-001","verdict":"confirmed"}]}'
      draft_map: '{"sections":[{"heading":"Identities","matrix_ids":["F-001"]}]}'
    assert:
      - type: contains-json
        value: |
          {
            "tone-changes.json": {"changes": [{"style_marker": "banned_patterns"}]}
          }
      - type: llm-rubric
        value: tone-changes.json records at least one change and each entry has location, before, after, and a named style marker.
